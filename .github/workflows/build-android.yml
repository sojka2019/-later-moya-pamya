name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:
 
permissions:
  contents: read 

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Get current Remember website
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android app from the existing site
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick python3-pil
          mkdir -p native-app/public native-app/assets
          cp index.html native-app/index.html
          cp manifest.json icon-192.png icon-512.png native-app/public/
                  # Use the new Remember icon for the Android launcher.
          cp icon-512.png native-app/assets/icon.png
          # Make a separate Android copy. Leave the published website untouched.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native-app/index.html")
          html = p.read_text(encoding="utf-8")
          marker = "load();\n</script>"
          if marker not in html:
              raise SystemExit("Could not find the expected end of the main app script in index.html")
          html = html.split(marker, 1)[0] + marker
          html += '\n<script type="module" src="./native-reminders.js"></script>\n</body>\n</html>\n'
          p.write_text(html, encoding="utf-8")
          PY
          cat > native-app/package.json <<'EOF_PACKAGE'
          {
            "name": "pamyatai-android",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": { "build": "vite build" },
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/local-notifications": "^8.3.1",
              "@capgo/capacitor-speech-recognition": "^8.4.4",
              "@capawesome/capacitor-file-picker": "^8.1.0",
              "@capacitor/filesystem": "^8.0.0",
              "@capacitor/share": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/ios": "^8.0.0",
              "@capacitor/cli": "^8.0.0",
              "vite": "^7.1.12"
            }
          }
          EOF_PACKAGE
          cat > native-app/vite.config.js <<'EOF_VITE'
          import { defineConfig } from 'vite';
          export default defineConfig({
            base: './',
            build: { outDir: 'dist', emptyOutDir: true }
          });
          EOF_VITE
          cat > native-app/capacitor.config.json <<'EOF_CAP'
          {
           "appId": "ch.pamyatai.remember.test86",
           "appName": "Нагадування",
           "webDir": "dist"
          }
          EOF_CAP
          cat > native-app/native-reminders.js <<'EOF_REMINDERS'
          import { Capacitor } from '@capacitor/core';
          import { LocalNotifications } from '@capacitor/local-notifications';
          import { SpeechRecognition } from '@capgo/capacitor-speech-recognition';
          const STORAGE_KEY = 'later-prototype-v1';
          if (Capacitor.isNativePlatform()) {
            const startupVoiceStatus = document.getElementById('voiceStatus');
            if (startupVoiceStatus) {
              startupVoiceStatus.textContent = 'Android-модуль завантажено';
              setTimeout(() => { if (startupVoiceStatus.textContent === 'Android-модуль завантажено') startupVoiceStatus.textContent = ''; }, 4000);
            }
            const micBtn = document.getElementById('micBtn');
            const micTitle = document.getElementById('micTitle');
            const micHint = document.getElementById('micHint');
            const voiceStatus = document.getElementById('voiceStatus');
            if (micBtn) {
              micBtn.onclick = async () => {
                try {
                  if (voiceStatus) voiceStatus.textContent = 'Перевіряю доступ до мікрофона…';
                  const permission = await SpeechRecognition.requestPermissions();
                  if (permission.speechRecognition !== 'granted') {
                    if (voiceStatus) voiceStatus.textContent = 'Дозволь доступ до мікрофона в налаштуваннях Android.';
                    return;
                  }
                  const availability = await SpeechRecognition.available();
                  if (!availability.available) {
                    if (voiceStatus) voiceStatus.textContent = 'На телефоні недоступне розпізнавання голосу. Перевір сервіс голосового введення Google.';
                    return;
                  }
                  if (micTitle) micTitle.textContent = 'Слухаю тебе…';
                  if (micHint) micHint.textContent = 'Скажи думку у вікні розпізнавання голосу';
                  if (voiceStatus) voiceStatus.textContent = '';
                  const result = await SpeechRecognition.start({
                    language: 'uk-UA',
                    maxResults: 1,
                    prompt: 'Скажіть, що потрібно запам’ятати',
                    popup: false,
                    partialResults: false
                  });
                  const spokenText = String(result?.matches?.[0] || '').trim();
                  if (!spokenText) {
                    if (voiceStatus) voiceStatus.textContent = 'Не вдалося розпізнати слова. Спробуй ще раз або введи текст.';
                    return;
                  }
                  const quickInput = document.getElementById('quickInput');
                  const quickAdd = document.getElementById('quickAdd');
                  if (quickInput && quickAdd) {
                    const parsed = parseVoiceReminder(spokenText);

                    document.getElementById('noteText').value = parsed.text;
                    document.getElementById('noteCategory').value = categoryFor(parsed.text);
                    document.getElementById('noteDate').value = parsed.date || '';

                    editingId = null;
                    document.getElementById('modalTitle').textContent = 'Перевір голосове нагадування';
                    document.getElementById('modal').classList.add('open');

                    if (voiceStatus) {
                      voiceStatus.textContent = 'Розпізнано: ' + parsed.text +
                        (parsed.hasDate
                          ? ' · Дата: ' + new Date(parsed.date).toLocaleString('uk-UA')
                          : ' · Укажи дату й час, якщо вони потрібні.');
                    }
                  }
                } catch (error) {
                  console.error('Native speech recognition error:', error);
                  if (voiceStatus) voiceStatus.textContent = 'Не вдалося використати мікрофон. Перевір дозвіл і сервіс голосового введення на телефоні.';
                } finally {
                  if (micTitle) micTitle.textContent = 'Запам’ятати голосом';
                  if (micHint) micHint.textContent = 'Натисни та продиктуй думку';
                }
              };
            }
            const sectionHead = document.querySelector('.section-head');
            if (sectionHead) {
              const button = document.createElement('button');
              button.className = 'secondary';
              const reminderButtonTexts = {
                uk: '🔔 Увімкнути системні нагадування',
                ru: '🔔 Включить системные напоминания',
                de: '🔔 Systemerinnerungen aktivieren',
                fr: '🔔 Activer les rappels système',
                it: '🔔 Attiva promemoria di sistema',
                en: '🔔 Enable system reminders',
                pl: '🔔 Włącz przypomnienia systemowe',
                es: '🔔 Activar recordatorios del sistema'
              };

                window.updateNativeReminderButtonLanguage = async () => {
                const language = localStorage.getItem('app-language') || 'uk';

                const texts = {
                  uk: {
                    enabled: '✅ Системні нагадування увімкнені',
                    disabled: '🔔 Увімкнути системні нагадування',
                    off: '🔕 Системні нагадування вимкнені',
                    exact: '⚠️ Дозволь точні нагадування в Android',
                    blocked: '🚫 Сповіщення заблоковано'
                  },
                  ru: {
                    enabled: '✅ Системные напоминания включены',
                    disabled: '🔔 Включить системные напоминания',
                    off: '🔕 Системные напоминания выключены',
                    exact: '⚠️ Разреши точные напоминания в Android',
                    blocked: '🚫 Уведомления заблокированы'
                  },
                  de: {
                    enabled: '✅ Systemerinnerungen aktiviert',
                    disabled: '🔔 Systemerinnerungen aktivieren',
                    off: '🔕 Systemerinnerungen ausgeschaltet',
                    exact: '⚠️ Genaue Erinnerungen erlauben',
                    blocked: '🚫 Benachrichtigungen blockiert'
                  },
                  fr: {
                    enabled: '✅ Rappels système activés',
                    disabled: '🔔 Activer les rappels système',
                    off: '🔕 Rappels système désactivés',
                    exact: '⚠️ Autoriser les rappels exacts',
                    blocked: '🚫 Notifications bloquées'
                  },
                  it: {
                    enabled: '✅ Promemoria di sistema attivati',
                    disabled: '🔔 Attiva promemoria di sistema',
                    off: '🔕 Promemoria disattivati',
                    exact: '⚠️ Consenti promemoria esatti',
                    blocked: '🚫 Notifiche bloccate'
                  },
                  en: {
                    enabled: '✅ System reminders enabled',
                    disabled: '🔔 Enable system reminders',
                    off: '🔕 System reminders disabled',
                    exact: '⚠️ Allow exact reminders',
                    blocked: '🚫 Notifications blocked'
                  },
                  pl: {
                    enabled: '✅ Przypomnienia systemowe włączone',
                    disabled: '🔔 Włącz przypomnienia systemowe',
                    off: '🔕 Przypomnienia wyłączone',
                    exact: '⚠️ Zezwól na dokładne przypomnienia',
                    blocked: '🚫 Powiadomienia zablokowane'
                  },
                  es: {
                    enabled: '✅ Recordatorios del sistema activados',
                    disabled: '🔔 Activar recordatorios del sistema',
                    off: '🔕 Recordatorios desactivados',
                    exact: '⚠️ Permitir recordatorios exactos',
                    blocked: '🚫 Notificaciones bloqueadas'
                  }
                };

                const t = texts[language] || texts.uk;

                try {
                  const permission = await LocalNotifications.checkPermissions();

                  if (permission.display !== 'granted') {
                    button.textContent = t.blocked;
                    return;
                  }

                  if (localStorage.getItem('reminders-enabled') === 'false') {
                    button.textContent = t.off;
                    return;
                  }

                  const exactPermission = await LocalNotifications.checkExactNotificationSetting();

                  button.textContent = exactPermission.exact_alarm === 'granted'
                    ? t.enabled
                    : t.exact;

                } catch (error) {
                  console.error('Reminder button status error:', error);
                  button.textContent = t.disabled;
                }
              };

              window.updateNativeReminderButtonLanguage();
              button.style.width = '100%';
              button.style.margin = '0 0 6px';
              sectionHead.insertAdjacentElement('afterend', button);
              const status = document.createElement('div');
              status.className = 'status';
              status.style.margin = '0 0 12px';
              button.insertAdjacentElement('afterend', status);
              function getNotes() {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
                catch { return []; }
              }
              const importButton = document.getElementById('importBackup');
              if (importButton) {
                importButton.onclick = async () => {
                  try {
                    const quickStatus = document.getElementById('quickStatus');
                    if (quickStatus) quickStatus.textContent = 'Відкриваю вибір резервної копії…';
                    const { FilePicker } = await import('@capawesome/capacitor-file-picker');
                    const picked = await FilePicker.pickFiles({
                      types: ['application/json', 'application/octet-stream'],
                      limit: 1,
                      readData: true
                    });
                    const file = picked && picked.files && picked.files[0];
                    if (!file) {
                      if (quickStatus) quickStatus.textContent = 'Файл не вибрано.';
                      return;
                    }
                    if (!file.data) throw new Error('Не вдалося прочитати файл. Спробуй вибрати JSON-файл із папки «Завантаження».');
                    const base64 = String(file.data).includes(',') ? String(file.data).split(',').pop() : String(file.data);
                    const binary = atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const text = new TextDecoder('utf-8').decode(bytes);
                    const backup = JSON.parse(text);
                    const incoming = Array.isArray(backup) ? backup : (backup && Array.isArray(backup.notes) ? backup.notes : null);
                    if (!incoming) throw new Error('Це не файл резервної копії «Пам’ятай».');
                    const merged = getNotes();
                    const fingerprints = new Set(merged.map(n => [String(n.text || '').trim().toLowerCase(), String(n.category || ''), String(n.date || ''), String(n.created || '')].join('\u241f')));
                    const ids = new Set(merged.map(n => String(n.id)));
                     let added = 0;
                    let duplicates = 0;
                    let invalid = 0;

                    const incomingCount = incoming.length;
                    const existingCountBefore = merged.length;

                    for (const raw of incoming) {
                      if (!raw || typeof raw.text !== 'string' || !raw.text.trim()) {
                        invalid++;
                        continue;
                      }

                      const item = {
                        ...raw,
                        text: raw.text.trim(),
                        category: typeof raw.category === 'string' ? raw.category : 'Інше',
                        date: typeof raw.date === 'string' ? raw.date : '',
                        created: typeof raw.created === 'string' ? raw.created : new Date().toISOString(),
                        done: Boolean(raw.done)
                      };

                      const fingerprint = [
                        item.text.toLowerCase(),
                        String(item.category),
                        item.date,
                        item.created
                      ].join('\u241f');

                      if (fingerprints.has(fingerprint)) {
                        duplicates++;
                        continue;
                      }

                      if (item.id === undefined || item.id === null || ids.has(String(item.id))) {
                        item.id = Date.now() + Math.random();
                      }

                      ids.add(String(item.id));
                      fingerprints.add(fingerprint);
                      merged.push(item);
                      added++;
                    }

                    if (added > 0) {
                      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
                    }

                    const savedAfter = getNotes();

                    if (quickStatus) {
                      quickStatus.textContent =
                        'Діагностика імпорту: ' +
                        'У файлі: ' + incomingCount +
                        '. Було в застосунку: ' + existingCountBefore +
                        '. Додано: ' + added +
                        '. Дублікатів: ' + duplicates +
                        '. Некоректних: ' + invalid +
                        '. У сховищі після імпорту: ' + savedAfter.length + '.';
                    }

                    setTimeout(() => window.location.reload(), 1200);
                  } catch (error) {
                    console.error('Native backup import error:', error);
                    const quickStatus = document.getElementById('quickStatus');
                    if (quickStatus) quickStatus.textContent = 'Не вдалося імпортувати файл: ' + (error && error.message ? error.message : 'невідома помилка');
                    else alert('Не вдалося імпортувати файл резервної копії.');
                  }
                };
              }
              const exportButton = document.getElementById('exportBackup');
              if (exportButton) {
                exportButton.onclick = async () => {
                  const quickStatus = document.getElementById('quickStatus');
                  let exportStage = 'початок';
                  try {
                    if (quickStatus) quickStatus.textContent = 'Починаю експорт…';

                    exportStage = 'завантаження Filesystem';
                    const { Filesystem, Directory, Encoding } = await import('@capacitor/filesystem');

                    exportStage = 'завантаження Share';
                    const { Share } = await import('@capacitor/share');

                    exportStage = 'підготовка даних';
                    const payload = {
                      format: 'pamyatai-backup',
                      version: 1,
                      exportedAt: new Date().toISOString(),
                      notes: getNotes()
                    };
                    const fileName = 'pamyatai-backup-' + new Date().toISOString().slice(0, 10) + '.json';

                    exportStage = 'запис файлу';
                    const file = await Filesystem.writeFile({
                      path: fileName,
                      data: JSON.stringify(payload, null, 2),
                      encoding: Encoding.UTF8,
                      directory: Directory.Cache,
                      recursive: true
                    });

                    exportStage = 'відкриття меню Android';
                    await Share.share({
                      title: 'Резервна копія «Пам’ятай»',
                      text: 'Збережи цей файл у надійному місці.',
                      files: [file.uri],
                      dialogTitle: 'Зберегти резервну копію'
                    });

                    if (quickStatus) quickStatus.textContent = 'Вибери програму для збереження резервної копії.';
                  } catch (error) {
                    console.error('Native backup export error:', error);
                    const details = error?.message || (error ? String(error) : 'невідома помилка');
                    if (quickStatus) quickStatus.textContent = 'Помилка на кроці «' + exportStage + '»: ' + details;
                  }
                };
              }
              function notificationId(value) {
                let hash = 2166136261; 
                for (const ch of String(value)) { hash ^= ch.charCodeAt(0); hash = Math.imul(hash, 16777619); }
                return (hash >>> 0) % 2000000000 + 1;
              }
            async function syncReminders() {
              try {
                if (localStorage.getItem('reminders-enabled') === 'false') {
                  await LocalNotifications.cancelAll();
                  status.textContent = 'Сповіщення вимкнено.';
                  return;
                }

                 const permission = await LocalNotifications.checkPermissions();

                if (permission.display !== 'granted') {
                  status.textContent = 'Спочатку дозволь сповіщення в Android.';
                  return;
                }

                const exactPermission = await LocalNotifications.checkExactNotificationSetting();

               if (exactPermission.exact_alarm !== 'granted') {
                  status.textContent = 'Потрібно дозволити точні нагадування в налаштуваннях Android. Натисни кнопку ввімкнення.';
                  return;
                }
                const notes = getNotes();
                const now = Date.now();

                const dayKey = value => {
                  const d = new Date(value);
                  return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
                };

                const schedules = [];

                 for (const note of notes) {
                   if (!note.date || note.done) continue;

                   const eventTime = new Date(note.date).getTime();
                   if (!Number.isFinite(eventTime) || eventTime <= now) continue;

                   const eventIsToday = dayKey(eventTime) === dayKey(now);

                   const reminders = [];

                   // Головне сповіщення безпосередньо в призначений час
                   reminders.push({
                     key: 'atTime',
                     title: '🔔 Час нагадування!',
                     time: eventTime,
                     message: String(note.text || 'У тебе є нагадування!')
                   });

                   // Попередження за 2 години, якщо подія сьогодні
                   if (eventIsToday) {
                     reminders.push({
                       key: 'twoHours',
                       title: 'Нагадування: за 2 години',
                       time: eventTime - 2 * 60 * 60 * 1000,
                       message: String(note.text || 'У тебе є нагадування!')
                     });
                   } else {
                     // Попередження за добу та за годину
                     reminders.push({
                       key: 'oneDay',
                       title: 'Нагадування: за добу',
                       time: eventTime - 24 * 60 * 60 * 1000,
                       message: String(note.text || 'У тебе є нагадування!')
                     });

                     reminders.push({
                       key: 'oneHour',
                       title: 'Нагадування: за годину',
                       time: eventTime - 60 * 60 * 1000,
                       message: String(note.text || 'У тебе є нагадування!')
                     });
                   }

                   for (const reminder of reminders) {
                     if (reminder.time <= now) continue;

                     schedules.push({
                       id: notificationId(String(note.id) + ':' + reminder.key),
                       title: reminder.title,
                       body: String(reminder.message || note.text || 'У тебе є нагадування!').slice(0, 500),
                       schedule: {
                         at: new Date(reminder.time),
                         allowWhileIdle: true
                       },
                       extra: {
                         noteId: String(note.id)
                       }
                     });
                   }
                 }

                 await LocalNotifications.cancelAll();

                 let scheduleWarning = null;

                 if (schedules.length) {
                   const scheduleResult = await LocalNotifications.schedule({
                     notifications: schedules
                   });
                   scheduleWarning = scheduleResult.warning || null;
                 }

                 status.textContent = scheduleWarning
                   ? 'Увага: Android не дозволив точний час. ' + scheduleWarning.message
                   : schedules.length
                     ? 'Заплановано сповіщень: ' + schedules.length + '.'
                     : 'Немає майбутніх сповіщень, які ще потрібно запланувати.';

                } catch (error) {
                  console.error('Local reminder error:', error);
                  status.textContent = 'Не вдалося запланувати нагадування. Перевір дозволи сповіщень.';
                }
                }
               const settingsNotificationButton = document.getElementById('notificationToggle');

              if (settingsNotificationButton) {
                async function updateSettingsNotificationButton() {
                  const permission = await LocalNotifications.checkPermissions();
                  const enabled = localStorage.getItem('reminders-enabled') !== 'false';

                  if (permission.display === 'denied') {
                    settingsNotificationButton.textContent = 'Сповіщення заблоковано';
                  } else if (!enabled) {
                    settingsNotificationButton.textContent = '🔕 Сповіщення вимкнено';
                  } else if (permission.display === 'granted') {
                    settingsNotificationButton.textContent = '🔔 Сповіщення ввімкнено';
                  } else {
                    settingsNotificationButton.textContent = '🔔 Увімкнути сповіщення';
                  }
                }

                settingsNotificationButton.addEventListener('click', async () => {
                  const enabled = localStorage.getItem('reminders-enabled') !== 'false';

                  if (enabled) {
                    localStorage.setItem('reminders-enabled', 'false');
                    await LocalNotifications.cancelAll();
                  } else {
                    let permission = await LocalNotifications.checkPermissions();
                    if (permission.display !== 'granted') {
                      permission = await LocalNotifications.requestPermissions();
                    }
                    if (permission.display !== 'granted') {
                      settingsNotificationButton.textContent = 'Сповіщення заблоковано';
                      return;
                    }
                    localStorage.setItem('reminders-enabled', 'true');
                    await syncReminders();
                  }

                  await updateSettingsNotificationButton();
                });

                updateSettingsNotificationButton();
              }
               button.addEventListener('click', async () => {
                try {
                  let permission = await LocalNotifications.checkPermissions();

                  if (permission.display !== 'granted') {
                    permission = await LocalNotifications.requestPermissions();
                  }

                  if (permission.display !== 'granted') {
                    status.textContent = 'Дозволь сповіщення для застосунку в налаштуваннях Android.';
                    await window.updateNativeReminderButtonLanguage();
                    return;
                  }

                  let exactPermission = await LocalNotifications.checkExactNotificationSetting();

                  if (exactPermission.exact_alarm !== 'granted') {
                    status.textContent = 'Дозволь точні нагадування в налаштуваннях Android.';
                    await LocalNotifications.changeExactNotificationSetting();

                    exactPermission = await LocalNotifications.checkExactNotificationSetting();

                    if (exactPermission.exact_alarm !== 'granted') {
                      await window.updateNativeReminderButtonLanguage();
                      return;
                    }
                  }

                  localStorage.setItem('reminders-enabled', 'true');
                  status.textContent = 'Перевіряю та планую нагадування…';

                  await syncReminders();
                  await window.updateNativeReminderButtonLanguage();

                } catch (error) {
                  console.error('Enable reminders error:', error);
                  status.textContent = 'Не вдалося ввімкнути сповіщення.';
                  await window.updateNativeReminderButtonLanguage();
                }
              });
              LocalNotifications.addListener('localNotificationActionPerformed', action => {
                const noteId = action.notification.extra?.noteId;
                if (noteId && typeof window.openReminderNote === 'function') {
                  window.openReminderNote(noteId);
                }
              });
              const refreshSoon = () => setTimeout(syncReminders, 600);
              document.getElementById('saveNote')?.addEventListener('click', refreshSoon);
              document.getElementById('quickAdd')?.addEventListener('click', refreshSoon);
              document.getElementById('notesGrid')?.addEventListener('click', refreshSoon);
              setTimeout(async () => {
                const permission = await LocalNotifications.checkPermissions();
                if (permission.display === 'granted') await syncReminders();
              }, 800);
            }
          }
          EOF_REMINDERS
      - name: Install web and Capacitor packages
        working-directory: native-app
        run: npm install --no-audit --no-fund
      - name: Check native reminder module 
        working-directory: native-app 
        run: | 
          echo "=== Lines 1-119 ===" 
          nl -ba native-reminders.js | sed -n '1,119p' 
          echo "=== JavaScript syntax check ===" 
          node --check native-reminders.js
      - name: Build the web files for Android
        working-directory: native-app
        run: npm run build

      - name: Generate Android project, icons, permissions and local notifications
        working-directory: native-app
        run: |
          npm install --no-save @capacitor/assets --no-audit --no-fund
          npx cap add android
          npx cap sync android
          sed -i '/^android[[:space:]]*{/a\    compileSdk 36' android/app/build.gradle 
          mkdir -p assets
          cp ../icon.png.png.png assets/icon.png
          npx capacitor-assets generate --android
          # Force every launcher density to use the known green source icon.
          declare -A icon_sizes=( [ldpi]=36 [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A adaptive_sizes=( [ldpi]=81 [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for density in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            size=${icon_sizes[$density]}
            convert assets/icon.png -resize ${size}x${size} "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            convert assets/icon.png -resize ${size}x${size} "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          adaptive_size=${adaptive_sizes[$density]}
          convert assets/icon.png -resize ${adaptive_size}x${adaptive_size} "android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
           
          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="Нагадування"'
          )
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
          ]
          for permission in permissions:
              permission_name = permission.split('"')[1]
              if permission_name not in text:
                  text = text.replace("<application", permission + "\n\n    <application", 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Build installable debug APK
        working-directory: native-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify notification recovery after reboot
        working-directory: native-app/android
        run: |
          MANIFEST=$(find app/build/intermediates/merged_manifest -type f -name AndroidManifest.xml | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: Merged AndroidManifest.xml not found"
            exit 1
          fi

          echo "Checking boot permission..."
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' "$MANIFEST"

          echo "Checking notification restore receiver..."
          grep -q 'com.capacitorjs.plugins.localnotifications.LocalNotificationRestoreReceiver' "$MANIFEST"

          echo "SUCCESS: Notification recovery components found!"
   
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Nagaduvannya-4_test86
          path: native-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
